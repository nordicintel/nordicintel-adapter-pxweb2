[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nordicintel-adapter-pxweb2"
version = "0.1.0"
description = "NordicIntel adapter for PxAPI v2 providers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "NordicIntel" }]
dependencies = ["nordicintel-core[http]>=0.1.0"]

# The name is the `adapter_type` a Provider row carries, and it is how a harvest worker
# turns that string into code without importing anything the database named.
[project.entry-points."nordicintel.adapters"]
pxweb2 = "nordicintel_adapter_pxweb2:factory"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
# Development checkout, matching the sibling layout of the other repositories.
# Replace with a pinned published release before deployment.
nordicintel-core = { path = "../nordicintel-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nordicintel_adapter_pxweb2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nordicintel_adapter_pxweb2"]